services:
  alarm_server:
    image: cm98765432/alarm_server:v5
    container_name: alarm_server
    ports:
      - '8080:8080'
    volumes:
      - alarm-data:/app/conf
    restart: always
    working_dir: /app
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://localhost:8080/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  alarm-data: {}
