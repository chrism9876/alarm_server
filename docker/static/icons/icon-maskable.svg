<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b7cf0"/><stop offset="1" stop-color="#1f56c4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <g transform="translate(256 270)">
    <!-- bells -->
    <path d="M-150 -78 A78 78 0 0 1 -78 -150 Z" fill="#fff" transform="translate(-6 -6)"/>
    <path d="M150 -78 A78 78 0 0 0 78 -150 Z" fill="#fff" transform="translate(6 -6)"/>
    <!-- bell hammer stem -->
    <rect x="-9" y="-176" width="18" height="34" rx="6" fill="#fff"/>
    <rect x="-34" y="-186" width="68" height="20" rx="10" fill="#fff"/>
    <!-- legs -->
    <path d="M-88 104 L-122 150" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
    <path d="M88 104 L122 150" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
    <!-- face -->
    <circle r="132" fill="#fff"/>
    <circle r="106" fill="#173f94"/>
    <!-- ticks -->
    <g fill="#fff">
      <rect x="-6" y="-94" width="12" height="20" rx="4"/>
      <rect x="-6" y="74" width="12" height="20" rx="4"/>
      <rect x="74" y="-6" width="20" height="12" rx="4"/>
      <rect x="-94" y="-6" width="20" height="12" rx="4"/>
    </g>
    <!-- hands -->
    <path d="M0 0 L-44 -40" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
    <path d="M0 0 L50 -62" stroke="#ffd34d" stroke-width="12" stroke-linecap="round"/>
    <circle r="14" fill="#fff"/>
  </g>
</svg>
